<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#0d2818;stop-opacity:0.95" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="2" fill="rgba(201,168,76,0.1)"/>
    </pattern>
  </defs>
  
  <!-- Base gradient -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- Pattern -->
  <rect width="1200" height="400" fill="url(#dots)"/>
  
  <!-- Decorative shapes -->
  <circle cx="1100" cy="50" r="150" fill="rgba(201,168,76,0.08)" opacity="0.5"/>
  <circle cx="100" cy="350" r="120" fill="rgba(201,168,76,0.06)" opacity="0.5"/>
  <circle cx="600" cy="400" r="200" fill="rgba(255,255,255,0.03)" opacity="0.3"/>
  
  <!-- Building/Academy silhouette elements -->
  <g opacity="0.08">
    <!-- Building shapes -->
    <rect x="950" y="150" width="80" height="220" fill="#ffffff"/>
    <polygon points="950,150 1030,100 1110,150" fill="#ffffff"/>
    <rect x="970" y="180" width="15" height="15" fill="#1a3a2a"/>
    <rect x="1015" y="180" width="15" height="15" fill="#1a3a2a"/>
    <rect x="970" y="220" width="15" height="15" fill="#1a3a2a"/>
    <rect x="1015" y="220" width="15" height="15" fill="#1a3a2a"/>
  </g>
  
  <!-- Academy/Learning symbols -->
  <g opacity="0.12">
    <circle cx="150" cy="100" r="40" fill="none" stroke="#c9a84c" stroke-width="2"/>
    <path d="M130 90 Q150 70 170 90" fill="none" stroke="#c9a84c" stroke-width="2"/>
    <text x="140" y="125" font-size="30" fill="#c9a84c">📚</text>
  </g>
  
  <!-- Light rays effect -->
  <g opacity="0.04">
    <line x1="600" y1="0" x2="550" y2="400" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
    <line x1="600" y1="0" x2="650" y2="400" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  </g>
</svg>